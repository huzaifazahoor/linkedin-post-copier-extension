<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Post Copier</title>
  <style>
    :root {
      --ink: #14212e;
      --muted: #5a6877;
      --paper: #ffffff;
      --field: #f3f6f9;
      --line: #cfd8e1;
      --accent: #0a66c2;
      --accent-ink: #ffffff;
      --ok: #157347;
      --ok-bg: #e7f5ee;
      --bad: #b3261e;
      --bad-bg: #fbeceb;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #9aa8b6;
        --paper: #1b232c;
        --field: #242e39;
        --line: #3a4756;
        --accent: #4d9cf0;
        --accent-ink: #0d1a26;
        --ok: #6fd3a0;
        --ok-bg: #1d3a2d;
        --bad: #f2a29c;
        --bad-bg: #432523;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      padding: 20px;
      font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    h1 { margin: 0 0 18px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }

    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
    .count {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      transition: border-color .15s;
    }
    .count:focus-within { border-color: var(--accent); }
    .count input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    .count input::placeholder { color: var(--muted); }
    .count input::-webkit-inner-spin-button { opacity: .5; }
    .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

    .check { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; font-size: 13px; cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 650;
      font-size: 15px;
      cursor: pointer;
      transition: filter .15s, background-color .2s;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .7; cursor: wait; }
    button.done { background: var(--ok); color: var(--paper); }

    #status {
      display: none;
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13px;
    }
    #status.ok { display: block; color: var(--ok); background: var(--ok-bg); }
    #status.bad { display: block; color: var(--bad); background: var(--bad-bg); }
    #status.info { display: block; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <h1>Copy LinkedIn posts</h1>

  <div class="field">
    <label for="count">How many posts?</label>
    <div class="count">
      <input type="number" id="count" min="1" step="1" inputmode="numeric" placeholder="All loaded posts">
    </div>
    <p class="hint">Leave empty to copy every post on the page.</p>
  </div>

  <label class="check"><input type="checkbox" id="skipReposts" checked> Skip posts I only reposted</label>

  <button id="copyBtn">Copy posts</button>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
