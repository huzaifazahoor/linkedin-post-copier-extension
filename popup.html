<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Post Copier</title>
  <style>
    :root {
      --ink: #1d2733;
      --muted: #5b6878;
      --paper: #ffffff;
      --line: #dde3ea;
      --accent: #0b5c8f;
      --ok: #1f7a4d;
      --bad: #a3361f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 18px;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    label { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 13px; }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:focus-visible { outline: 3px solid #9cc7e6; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 20px; margin-top: 12px; font-size: 13px; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    #output {
      display: none;
      width: 100%;
      height: 120px;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: 12px/1.4 system-ui, sans-serif;
      color: var(--ink);
      resize: vertical;
    }
  </style>
</head>
<body>
  <h1>LinkedIn Post Copier</h1>
  <p>Copies the posts loaded on this page as clean text with their numbers.</p>
  <label><input type="checkbox" id="skipReposts" checked> Skip posts I only reposted</label>
  <button id="copyBtn">Copy posts</button>
  <div id="status" role="status"></div>
  <textarea id="output" readonly aria-label="Copied posts"></textarea>
  <button id="copyAgain" style="display:none;margin-top:8px">Copy text</button>
  <script src="popup.js"></script>
</body>
</html>
